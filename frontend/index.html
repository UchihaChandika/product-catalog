<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Praktikum Komputasi Awan</title>
	<!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body late-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:teclass="bg-sxt-white">
	<header class="sticky top-0 z-40 backdrop-blur-md bg-white/80 border-b border-slate-200 shadow-sm transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-bag-shopping text-lg"></i>
                </div>
                <span class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-slate-900 to-indigo-900 bg-clip-text text-transparent">LuxeCart</span>
            </div>

    <h1>Lalalaalla</h1>

    <div id="products">
        Loading...
    </div>

    <script>

        fetch("/api/products")

            .then(response => response.json())

            .then(products => {

                const container =
                    document.getElementById("products");

                container.innerHTML = "";

                products.forEach(product => {

                    container.innerHTML += `
                        <div>
                            <h2>${product.name}</h2>
                            <p>Harga: Rp ${product.price}</p>
                            <p>Stok: ${product.stock}</p>
                        </div>
                    `;

                });

            })

            .catch(error => {

                console.error(error);

                document.getElementById("products").innerHTML =
                    "Gagal mengambil data produk.";

            });

    </script>

</body>

</html>
